---
- name: Create system management users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups }}"
    shell: "{{ item.shell }}"
    state: present
  loop: "{{ sys_users }}"

- name: Add SSH authorized keys for system users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.pubkey }}"
  when: item.pubkey != ""
  loop: "{{ sys_users }}"
