name: CI/CD Pipeline - Infrastructure & Configuration Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  terraform-validate:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.0

      - name: Check Terraform Code Formatting
        run: terraform fmt -check -recursive

      - name: Validate Bootstrap Remote State
        run: |
          cd bootstrap/remote-state
          terraform init -backend=false
          terraform validate

      - name: Validate Dev Environment
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate

      - name: Validate Prod Environment
        run: |
          cd terraform/environments/prod
          terraform init -backend=false
          terraform validate

  ansible-lint:
    name: Ansible & Yaml Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ansible & Linters
        run: |
          python -m pip install --upgrade pip
          pip install ansible community.general community.docker yamllint markdownlint-cli || pip install ansible community.general community.docker yamllint

      - name: Run Yaml Lint Check
        run: yamllint -d "{extends: default, rules: {line-length: disable}}" .

      - name: Ansible Playbook Syntax Verification
        run: |
          cd ansible
          ansible-playbook -i inventories/dev/hosts.yml site.yml --syntax-check
