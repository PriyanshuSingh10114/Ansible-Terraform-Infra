name: AWS Infrastructure & Ansible CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  terraform-lint-and-validate:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Validate Dev Environment
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate

      - name: Validate Prod Environment
        run: |
          cd terraform/environments/prod
          terraform init -backend=false
          terraform validate

  ansible-lint:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: pip install ansible community.general community.docker

      - name: Ansible Playbook Syntax Check
        run: |
          cd ansible
          ansible-playbook -i inventories/dev/hosts.yml site.yml --syntax-check
